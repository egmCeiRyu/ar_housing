<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Analytics</title>

<link rel="stylesheet" href="css/common.css?v=mobile-return">
<link rel="stylesheet" href="css/analytics.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script defer src="js/analytics.js?v=client-access"></script>

</head>

<body>


<main class="app-page analytics-page has-return">
    <a class="return-link" href="home.html" id="analyticsBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>戻る</span></a>

    <h1 class="page-title">
        分析レポート
    </h1>

    <h2 id="projectName">Loading...</h2>

    <div id="analyticsReport">
    <div class="stats-grid">

        <div class="stat-card">
            <span>総アクセス数 </span>
            <strong id="totalViews">0</strong>
        </div>

        <div class="stat-card">
            <span>AR起動回数</span>
            <strong id="totalSessions">0</strong>
        </div>

        <div class="stat-card">
            <span>平均利用時間</span>
            <strong id="averageTime">0s</strong>
        </div>

    </div>

    <div class="analytics-card">
        <h3>利用デバイス</h3>
        <div id="deviceStats"></div>
    </div>

    <div class="analytics-card">
        <h3>利用ブラウザ</h3>
        <div id="browserStats"></div>
    </div>

    <div class="analytics-card">
        <h3>最近の利用履歴</h3>
        <div id="latestSessions"></div>
    </div>

    </div>
</main>

</body>
</html>
