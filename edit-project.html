<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Edit Project</title>

<link rel="stylesheet" href="css/common.css?v=qrie-radius-zero">
<link rel="stylesheet" href="css/project.css?v=qrie-radius-zero">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=ar-entry"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script defer src="js/edit-project.js?v=ar-entry"></script>

</head>

<body>
<main class="app-page analytics-page has-return">

    <button type="button" class="return-link" onclick="goBackToClient()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>戻る</span></button>

    <header class="header">

        <div class="project-header">
            <h1 class="title-project">
                プロジェクト設定
            </h1>
        </div>

    </header>

    <div class="form-card">

        <label>
            プロジェクト名
        </label>

        <input id="name">

        <p>AR画面のお問い合わせ先には、このプロジェクトの顧客メールアドレスが自動的に使用されます。</p>

        <label>
            GLB URL
        </label>

        <input id="glbUrl" type="text">

        <div class="drop-zone" id="glbDropZone">
            <div class="drop-title">
                GLBファイルをアップロード
            </div>

            <div class="drop-text">
                ここにGLBファイルをドラッグ＆ドロップ
            </div>

            <input
                type="file"
                id="glbFileInput"
                accept=".glb"
                hidden>
        </div>

        <label>
            サムネイルURL
        </label>

        <input id="thumbnailUrl" type="text">

        <div class="drop-zone" id="thumbDropZone">
            <div class="drop-title">
                サムネイルをアップロード
            </div>

            <div class="drop-text">
                ここに画像をドラッグ＆ドロップ
            </div>

            <input
                type="file"
                id="thumbFileInput"
                accept="image/*"
                hidden>
        </div>

        <label>
            編集可能なマテリアル
        </label>

        <input
            id="editableMaterial"
            type="text"
            value="wallpaint"
            disabled>

        <label>
            ステータス
        </label>

        <select id="status">

            <option value="active">
                有効
            </option>

            <option value="inactive">
                無効
            </option>

        </select>

        <button id="saveBtn">
            保存
        </button>

    </div>

    <div class="form-card" id="colors">

        <h2>
            カラー
        </h2>

        <label>
            カラー名
        </label>

        <input
            id="colorName"
            placeholder="ホワイト">

        <label>
            色
        </label>

        <div class="color-row">

            <input
                type="color"
                id="colorPicker"
                value="#ffffff">

            <input
                type="text"
                id="colorHex"
                value="#FFFFFF">

        </div>

        <button id="addColorBtn">
            カラーを追加
        </button>

        <div id="colorList"></div>

    </div>

</main>

</body>
</html>
