<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QRIE | ポータル</title>
    <meta name="description" content="QRIEの物件ARポータル。お客様と管理者のログインはこちら。">
    <link rel="stylesheet" href="css/home.css?v=qrie-portal">
</head>
<body>
    <div class="portal">
        <header class="portal-header">
            <a class="brand" href="home.html" aria-label="QRIE ホーム">
                <svg viewBox="0 0 36 36" aria-hidden="true">
                    <path d="M4 12V4h8m12 0h8v8m0 12v8h-8m-12 0H4v-8M11 17l7-6 7 6v8H11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>QRIE <small>キュリエ</small></span>
            </a>
            <span class="header-label">物件ARポータル</span>
        </header>

        <main class="portal-main">
            <section class="portal-intro" aria-labelledby="portal-heading">
                <p class="eyebrow">不動産ARサービス</p>
                <h1 id="portal-heading">建つ前の家を、<br>その土地で見せる。</h1>
                <p class="intro-copy">スマートフォンで、完成前の住まいをその場に。<br class="wide-only">QRIEのポータルから、物件やQRコードを確認できます。</p>

                <nav class="portal-access" aria-label="ログイン">
                    <a class="access-link access-primary" href="client-login.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6"/></svg>
                        <span><strong>お客様ログイン</strong><small>物件・QRコード・閲覧データを確認</small></span>
                        <span class="arrow" aria-hidden="true">→</span>
                    </a>
                    <a class="access-link access-secondary" href="admin-login.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15v2m4-5v5m4-9v9"/></svg>
                        <span><strong>管理者ログイン</strong><small>物件・お客様情報を管理</small></span>
                        <span class="arrow" aria-hidden="true">→</span>
                    </a>
                </nav>
            </section>

            <figure class="portal-visual">
                <img src="css/qrie-home-ar.jpg" width="850" height="850" alt="スマートフォンのAR画面に、現地に建つ住宅のイメージを表示">
                <figcaption><span aria-hidden="true"></span> 現地でのAR表示イメージ</figcaption>
            </figure>
        </main>
        <footer class="portal-footer">QRIE <span>by CeiRyu</span></footer>
    </div>
</body>
</html>
