<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRIE · 家具配置エディター</title>
<link rel="stylesheet" href="css/furniture-editor.css?v=welcome-help">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<script type="module" src="./vendor/model-viewer/dist/model-viewer.min.js"></script>

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<header><a id="whole-house" href="ar.html">家全体を見る</a><strong>QRIE</strong><span>家具配置エディター</span></header>
<main>
<aside>
<h1>家具を配置する</h1>


<div class="catalog" aria-label="家具カテゴリー">

</div>

<button id="choose-wallpaper" type="button" disabled>壁紙を選ぶ</button>
<div class="wall-scale-row"><label>内壁の色 <input id="wall-color" type="color" value="#e8ded0"></label>
<label><span>AR縮尺</span>
<select id="ar-scale">
<option>10%</option><option>20%</option><option>30%</option><option>40%</option><option>50%</option>
<option>60%</option><option>70%</option><option>80%</option><option>90%</option><option selected>100%</option>
</select>
</label></div>
<hr>
<p id="status" role="status">配置する家具を選んでください。</p>

<p>ARで見るには、まず「配置を確認」を押し、プレビュー画面で「ARで見る」を押してください。</p>
<button id="preview" class="primary">配置を確認</button>
</aside>
<section class="workspace" aria-label="3Dエディター">
<div class="floor-toolbar"><label>階数
<select id="floor-select">
<option value="0">1階</option>
<option value="1">2階</option>
</select>
</label></div>
<div id="stage">
<p id="stage-notice" role="status">3Dモデルを読み込んでいます…</p>
<div id="size-flag" aria-live="polite" hidden></div>
</div>
<section id="selection-actions" class="selection-actions" aria-label="選択した家具" hidden><p id="selection-name" role="status"></p><div class="actions">
<button id="rotate" disabled>45°回転</button><button id="remove" disabled>削除</button>
</div></section>
<div id="result" hidden>
<model-viewer id="ar-viewer" class="ar-source" loading="eager" alt="選択した縮尺の部屋" ar ar-modes="webxr quick-look" ar-usdz-max-texture-size="1024"><span slot="ar-button"></span></model-viewer>
<div class="result-actions"><button id="launch-ar" disabled>ARで見る</button><button id="back">編集に戻る</button></div>
</div>
</section>
</main>
<section id="wallpaper-sheet" class="wallpaper-sheet" role="dialog" aria-labelledby="wallpaper-title" hidden>
    <h2 id="wallpaper-title">壁紙を選ぶ</h2>
    <p id="wallpaper-scope"></p>
    <div class="wallpaper-content">
    <div id="wallpaper-options" class="wallpaper-options" aria-label="壁紙の種類"></div>
    <label class="wallpaper-size">柄の大きさ <output id="wallpaper-size-value" for="wallpaper-size">100 cm</output>
        <input id="wallpaper-size" type="range" min="25" max="200" step="25" value="100">
    </label>
    <p id="wallpaper-message" role="status"></p>
    </div>
    <div class="wallpaper-actions">
        <button id="wallpaper-cancel" type="button">キャンセル</button>
        <button id="wallpaper-apply" type="button" class="primary">適用</button>
    </div>
</section>
<dialog id="editor-help" class="editor-help" aria-labelledby="editor-help-title"><h2 id="editor-help-title">家具の配置方法</h2><p>家具を床にドラッグするか、家具を選んで配置したい場所をタップしてください。空いている場所をドラッグすると視点を回転できます。</p><button type="button" class="primary">はじめる</button></dialog>
<script>
const notice = document.getElementById('stage-notice');
if (location.protocol === 'file:') {
    notice.textContent = '3Dモデルを表示するには、Abrir QRIE.cmd を起動してください。';
} else {
    import('./js/furniture-editor.js?v=20261112-wood-floor').then(() => notice.remove()).catch(error => {
        console.error(error);
        notice.textContent = error.message || '3Dモデルを読み込めませんでした。';
    });
}
</script>
</body>
</html>
