<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QRIE | 顧客ポータル</title>

<link rel="stylesheet" href="css/common.css?v=qrie-radius-zero">
<link rel="stylesheet" href="css/client-portal.css?v=qrie-square">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script defer src="js/client-portal.js?v=qrie-portal-brand"></script>

</head>

<body>

<main class="portal-shell">
    <header class="portal-header">
        <span class="portal-brand">
            <svg viewBox="0 0 36 36" aria-hidden="true">
                <path d="M4 12V4h8m12 0h8v8m0 12v8h-8m-12 0H4v-8M11 17l7-6 7 6v8H11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            QRIE
        </span>
        <span class="portal-label">顧客ポータル</span>
    </header>

    <button type="button" id="backButton" class="return-link" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>戻る</span></button>

    <section class="portal-hero">

        <div>
            <h1 id="clientName">読み込み中...</h1>
            <p>
                各プロジェクトのQRコードとアクセス分析を確認できます。
            </p>
        </div>

    </section>

    <section id="clientInfo" class="client-info"></section>

    <section class="projects-section">

        <div class="section-title">
            <h2>プロジェクト一覧</h2>
        </div>

        <div id="projectList" class="portal-project-grid"></div>

    </section>


</main>

</body>
</html>
