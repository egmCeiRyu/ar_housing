<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>新しいパスワード</title>

<link rel="stylesheet" href="css/common.css?v=qrie-radius-zero">
<link rel="stylesheet" href="css/client-login.css?v=qrie-square">
</head>

<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-brand">
            <svg viewBox="0 0 36 36" aria-hidden="true">
                <path d="M4 12V4h8m12 0h8v8m0 12v8h-8m-12 0H4v-8M11 17l7-6 7 6v8H11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>QRIE <small>キュリエ</small></span>
        </div>

        <h1>新しいパスワード</h1>

        <p class="subtitle">
            新しいパスワードを入力してください。
        </p>

        <label class="login-field" for="password">新しいパスワード</label>
        <input id="password" type="password" autocomplete="new-password">

        <label class="login-field" for="confirmPassword">新しいパスワード確認</label>
        <input id="confirmPassword" type="password" autocomplete="new-password">

        <button id="updateButton">
            パスワードを更新
        </button>

        <p id="message" class="login-message"></p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/reset-password.js"></script>

</body>
</html>
