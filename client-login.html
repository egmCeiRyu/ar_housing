<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>お客様ログイン</title>

    <link rel="stylesheet" href="css/common.css?v=mobile-return">
    <link rel="stylesheet" href="css/client-login.css?v=qrie-square">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <svg viewBox="0 0 36 36" aria-hidden="true">
                <path d="M4 12V4h8m12 0h8v8m0 12v8h-8m-12 0H4v-8M11 17l7-6 7 6v8H11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>QRIE <small>キュリエ</small></span>
        </div>

        <h1>
            お客様ログイン
        </h1>

        <p class="subtitle">
            お客様ポータルへログインしてください。
        </p>

        <label class="login-field" for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="email">

        <label class="login-field" for="password">パスワード</label>
        <input id="password" type="password" autocomplete="current-password">

        <button id="loginButton">
            ログイン
        </button>

        <a class="forgot-password" href="forgot-password.html">パスワードをお忘れの方</a>

        <a class="return-link return-link--login" href="home.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>ホームへ戻る</span></a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/client-login.js"></script>

</body>

</html>
