<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AR Viewer</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link rel="stylesheet" href="css/ar.css?v=round-color-bar">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script defer src="js/ar.js?v=furniture-entry"></script>

</head>

<body>

<a id="emailClientButton" hidden aria-label="メールでお問い合わせ">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" />
        <path d="m3 6 9 7 9-7" />
    </svg>
    <span>お問い合わせ</span>
</a>

<div id="loading">
    読み込み中...
</div>

<model-viewer
    id="viewer"
    ar
    ar-modes="webxr quick-look scene-viewer"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    exposure="1">
    <button slot="ar-button" hidden></button>
</model-viewer>

<a id="decorateLink" hidden style="position:fixed;top:74px;right:16px;z-index:10;padding:12px 18px;background:#142e54;color:white;text-decoration:none">家具を配置する</a>
<div id="viewerControls">
    <div id="colorBar"></div>
    <div id="arActions">
        <label for="arScale">縮尺</label>
        <select id="arScale" disabled>
            <option value="0.05">10%</option>
            <option value="0.1">20%</option>
            <option value="0.15">30%</option>
            <option value="0.2">40%</option>
            <option value="0.25" selected>50%</option>
            <option value="0.3">60%</option>
            <option value="0.35">70%</option>
            <option value="0.4">80%</option>
            <option value="0.45">90%</option>
            <option value="1">100%（実寸大）</option>
        </select>
        <button id="openAR" type="button" disabled>ARで見る</button>
    </div>
</div>

</body>
</html>
