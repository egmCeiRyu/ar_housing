<!doctype html><html lang="ja"><meta charset="utf-8"><title>QRIE カテゴリー・ローカル検証</title><h1>ローカル検証・本番には保存されません</h1><p>このページは実際の画面と JavaScript を使い、データはメモリ内だけに保持します。</p><iframe id="app" title="ローカルアセット管理" style="width:100%;height:950px;border:1px solid #ccd7e3"></iframe><p id="fixture-status" role="status">準備中</p><script type="module">
const fixture={categories:[{id:'sofa',name:'ソファ',sort_order:1,archived_at:null},{id:'other',name:'その他',sort_order:2,archived_at:null}],assets:[{id:'local-asset',name:'ローカル検証用',category_id:'sofa',asset_type:'model',status:'active',width:1,height:1,depth:1,thumbnail_url:null,original_filename:'local.glb',file_size:1,uploaded_at:'2026-01-01'}],sequence:0};
const response=await fetch('../asset-manager.html');const documentSource=new DOMParser().parseFromString(await response.text(),'text/html');documentSource.querySelectorAll('script:not([type="importmap"])').forEach(script=>script.remove());const base=documentSource.createElement('base');base.href=new URL('../',location.href).href;documentSource.head.prepend(base);
const app=document.querySelector('#app');app.addEventListener('load',()=>{
 const win=app.contentWindow;
 win.requireAdmin=async()=>true;
 win.supabaseClient={from(table){const filters=[];const chain={select(){return chain},is(key,value){filters.push(row=>row[key]===value);return chain},eq(key,value){filters.push(row=>row[key]===value);return chain},order(){return chain},limit(){return chain},then(resolve){const rows=table==='asset_categories'?fixture.categories:[];return Promise.resolve({data:rows.filter(row=>filters.every(fn=>fn(row))),error:null}).then(resolve)}};return chain},functions:{async invoke(name,{body}){
  let data={};const action=body.action;
  const fail=message=>({data:null,error:{context:{json:async()=>({error:message})}}});
  if(action==='list'){let assets=fixture.assets.filter(a=>body.status?a.status===body.status:a.status!=='deleted');if(body.category_id)assets=assets.filter(a=>a.category_id===body.category_id);if(body.search)assets=assets.filter(a=>a.name.includes(body.search));data={assets:structuredClone(assets),count:assets.length,page:0};}
  else if(action==='category_list'){data={categories:fixture.categories.filter(c=>body.include_archived||!c.archived_at).map(c=>({...c,asset_count:fixture.assets.filter(a=>a.category_id===c.id).length}))};}
  else if(action==='category_create'){if(fixture.categories.some(c=>!c.archived_at&&c.name===body.name.trim()))return fail('同じ名前のカテゴリーがあります。');const id='local-category-'+(++fixture.sequence);fixture.categories.push({id,name:body.name.trim(),sort_order:fixture.sequence+2,archived_at:null});data={id};}
  else if(action==='category_rename'||action==='category_restore'){const category=fixture.categories.find(c=>c.id===body.id);if(!category)return fail('カテゴリーが見つかりません。');category.name=body.name.trim();if(action==='category_restore')category.archived_at=null;data={id:category.id};}
  else if(action==='category_delete'){const category=fixture.categories.find(c=>c.id===body.id);const assets=fixture.assets.filter(a=>a.category_id===body.id);if(assets.length&&!body.target_category_id)return fail('アセットの移動先カテゴリーを選択してください。');assets.forEach(a=>a.category_id=body.target_category_id);category.archived_at='2026-01-01';data={id:category.id};}
  else if(action==='update'){Object.assign(fixture.assets.find(a=>a.id===body.id),body);data={id:body.id};}
  else return fail('Local fixture does not support this operation');
  document.querySelector('#fixture-status').textContent=JSON.stringify({lastAction:action,categories:fixture.categories.length,assetCategory:fixture.assets[0].category_id});return {data,error:null};
 }}};
 const script=win.document.createElement('script');script.type='module';script.src=new URL('../js/asset-manager.js?v=category-local',location.href).href;win.document.head.append(script);
});app.srcdoc=documentSource.documentElement.outerHTML;
</script></html>
