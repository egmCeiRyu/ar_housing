<!doctype html><html lang="ja"><meta charset="utf-8"><title>QRIE モバイルレイアウト確認</title><h1>390px レイアウト確認</h1><iframe id="mobile" title="390px アセット管理" style="width:390px;height:844px;border:1px solid #ccc"></iframe><p id="status" role="status">読み込み中</p><script type="module">
const params=new URL(location.href).searchParams;
const dashboard=params.get('page')==='dashboard';
const response=await fetch(dashboard?'../index.html':'../asset-manager.html');
const markup=(await response.text()).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace('<head>','<head><base href="'+new URL('../',location.href).href+'">');
const frame=document.querySelector('#mobile');
frame.style.width=params.get('layout')==='desktop'?'1000px':'390px';
frame.addEventListener('load',()=>{const d=frame.contentDocument;const button=d.querySelector('#newClientBtn'),link=d.querySelector('.admin-hero-actions a');
const placement=button&&link?{assetBelow:link.getBoundingClientRect().top>=button.getBoundingClientRect().bottom,sameLeft:Math.abs(link.getBoundingClientRect().left-button.getBoundingClientRect().left)<1,justify:frame.contentWindow.getComputedStyle(link).justifyContent,align:frame.contentWindow.getComputedStyle(link).alignItems}:{};
document.querySelector('#status').textContent=JSON.stringify({viewport:frame.contentWindow.innerWidth,pageWidth:d.documentElement.scrollWidth,...placement});});
frame.srcdoc=markup;
</script></html>
