<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>管理者ログイン</title>

    <link rel="stylesheet" href="css/common.css?v=mobile-return">
    <link rel="stylesheet" href="css/admin-login.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">
            🏠
        </div>

        <div class="page-label">
            AR Housing
        </div>

        <h1>
            管理者ログイン
        </h1>

        <p class="subtitle">
            管理画面へログインしてください。
        </p>

        <input
            id="email"
            type="email"
            placeholder="メールアドレス">

        <div class="password-area">

            <input
                id="password"
                type="password"
                placeholder="パスワード">

            <button
                id="togglePassword"
                type="button">
                表示
            </button>

        </div>

        <button id="loginButton">
            ログイン
        </button>

        <p id="loginMessage" class="login-message"></p>

        <a class="return-link return-link--login" href="home.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>ホームへ戻る</span></a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-login.js"></script>

</body>

</html>
